name: expense_tracker
description: A simple offline expense tracker app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
